name: aud_audio_auv3
description: "Audio Unit v3 extension of the Audanika Audio Engine over its headless host"
version: 0.2.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_auv3
repository: https://github.com/audaudio/aud_audio_auv3

environment:
  sdk: ^3.12.2

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dependencies:
  ffi: ^2.2.0
  aud_audio_plugin:
    git:
      url: git@github.com:audaudio/aud_audio_plugin.git
      tag_pattern: "{{version}}"
    version: ^0.1.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.4
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.5
dev_dependencies:
  dna_audanika: ^0.0.2
  flutter_lints: ^6.0.0
  helix: ^1.14.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.31.1